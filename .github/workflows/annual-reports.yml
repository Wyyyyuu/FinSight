name: Annual report workspace

on:
  push:
    paths:
      - 'backend/annual_reports/**'
      - 'backend/api/annual_report_router.py'
      - 'tests/annual_reports/**'
      - 'requirements-annual.txt'
      - 'frontend/**'
      - 'scripts/verify_annual_midea_2024.py'
      - 'scripts/collect_annual_reports.py'
      - '.github/workflows/annual-reports.yml'
  pull_request:
    paths:
      - 'backend/annual_reports/**'
      - 'backend/api/annual_report_router.py'
      - 'tests/annual_reports/**'
      - 'requirements-annual.txt'
      - 'frontend/**'
      - 'scripts/verify_annual_midea_2024.py'
      - 'scripts/collect_annual_reports.py'
      - '.github/workflows/annual-reports.yml'

jobs:
  evidence-workflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-annual.txt
      - run: pip install -r requirements-annual.txt pytest-cov ruff reportlab
      - run: python -m ruff check backend/annual_reports backend/api/annual_report_router.py tests/annual_reports scripts/collect_annual_reports.py
      - run: python -m pytest tests/annual_reports -q --cov=backend.annual_reports --cov=backend.api.annual_report_router --cov-report=term-missing --cov-fail-under=80

  browser-workspace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx eslint src/pages/AnnualReportsPage.tsx src/api/annualReports.ts src/api/annualReports.test.ts
      - run: npm run test:unit -- --reporter=dot
      - run: npm run build
        env:
          VITE_ANNUAL_REPORT_API_BASE_URL: '.'
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- e2e/annual-reports.spec.ts --workers=1
